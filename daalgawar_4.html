<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="userForm">
        <label>Ovog</label>
        <input name="ovog" required>
        <label>Ner</label>
        <input name="name" required>
        <label>Nas</label>
        <input name="nas" required>
        <label>Huis</label>
        <input name="huis" required>
        <label>Email</label>
        <input name="email" type="email" required>
        <label>Angi</label>
        <input name="angi" required>
        <label>Tursun udur</label>
        <input name="tursunUdur" required>
        <button type="submit">Hadgalah</button>
    </form>
    <ul id="userList"></ul>
    <style>
        form {
            max-width: 350px;
            border-radius: 12px;
            box-shadow: 0 4px 16px #0002;
            }
        input { width: 80%; padding: 8px; }
        button { 
            background: #14b8a6;   
        }
    </style>
    <script>
        const users = [];
        const form = document.getElementById("userForm");
        form.addEventListener("submit", (e) =>{
            e.preventDefault();
            const data = new FormData(form);
            const user = {
                ovog: data.get("ovog").trim(),
                name: data.get("name").trim(),
                nas: data.get("nas").trim(),
                huis: data.get("huis").trim(),
                email: data.get("email").trim(),
                angi: data.get("angi").trim(),
                tursunUdur: data.get("tursunUdur").trim(),
            };
            users.push(user);
            form.reset();
            renderUsers();
        });
        function renderUsers(){
            const list = document.getElementById("userList");
            list.innerHTML = "";
            users.forEach((u) => {
                const li = document.createElement("li");
                li.textContent = u.ovog + " - " + u.name + " - " + u.email 
                + " - " + u.nas + " - " + u.huis + " - " + u.angi + " - " 
                + u.tursunUdur;
                list.appendChild(li);
            });
        }
    </script>
</body>
</html>
